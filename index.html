<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sorting Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root{
    --ink:#0C141D; --panel:#16212D; --panel-2:#1E2C3A; --line:#2B3C4D;
    --text:#E7EEF5; --muted:#8FA3B6;
    --signal:#FFB020; --go:#2FBF71; --stop:#F2555A; --info:#57A6FF; --r:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px; min-height:100vh; background:var(--ink); color:var(--text);
    font-family:'Barlow Semi Condensed',system-ui,sans-serif; font-size:17px;
    display:flex; flex-direction:column; align-items:center;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

  .topbar{width:100%; max-width:380px; display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .topbar h1{font-size:20px; font-weight:600; margin:0; flex:1}
  .topbar .cat{font-size:13px; color:var(--muted); display:block; font-weight:400}
  .close-btn{
    width:36px;height:36px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-size:18px;cursor:pointer;
  }
  .close-btn:hover{color:var(--stop);border-color:rgba(242,85,90,.5)}

  .stage{
    position:relative; width:100%; max-width:380px; aspect-ratio:1/1;
    border-radius:16px; overflow:hidden; background:#000; border:1px solid var(--line);
  }
  #reader{width:100%;height:100%}
  #reader video{width:100%;height:100%;object-fit:cover}

  .scan-overlay{position:absolute;inset:0;pointer-events:none;z-index:5}
  .scan-frame{position:absolute;left:8%;right:8%;top:24%;bottom:24%;border:2px solid rgba(255,255,255,.3);border-radius:10px}
  .scan-line{
    position:absolute;left:8%;right:8%;height:3px;top:24%;
    background:linear-gradient(90deg,transparent,var(--signal) 18%,#FFD27F 50%,var(--signal) 82%,transparent);
    box-shadow:0 0 10px 3px rgba(255,176,32,.55);
    animation:scanMove 1.7s ease-in-out infinite;
  }
  @keyframes scanMove{
    0%{top:24%;opacity:0} 8%{opacity:1} 50%{top:74%;opacity:1} 92%{opacity:1} 100%{top:24%;opacity:0}
  }

  .cam-controls{position:absolute;top:10px;right:10px;z-index:6;display:none;flex-direction:column;gap:6px}
  .cam-btn{
    width:36px;height:36px;border-radius:50%;border:none;background:rgba(12,20,29,.72);color:#fff;
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);
  }
  .cam-btn.active{background:var(--signal);color:#20160A}
  .zoom-group{display:flex;flex-direction:column;background:rgba(12,20,29,.72);border-radius:18px;overflow:hidden}
  .zoom-group .cam-btn{background:transparent;border-radius:0}

  #live{
    font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;letter-spacing:.06em;
    color:var(--go);text-align:center;margin:12px 0 2px;min-height:28px;
  }
  #live.invalid{color:var(--stop)}
  #alertMsg{font-size:14px;font-weight:600;color:var(--stop);text-align:center;margin:0;min-height:18px}
  #hint{font-size:14px;color:var(--muted);margin:6px 0 0;text-align:center;max-width:360px;line-height:1.5}

  .manual{margin-top:20px;width:100%;max-width:380px}
  label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
  input{
    width:100%;padding:13px 14px;border-radius:var(--r);background:var(--panel);
    border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;
    font-size:20px;text-align:center;letter-spacing:.06em;outline:none;margin-bottom:10px;
  }
  input:focus{border-color:var(--info);box-shadow:0 0 0 3px rgba(87,166,255,.18)}
  button.primary{
    width:100%;padding:15px;border-radius:var(--r);border:0;background:var(--signal);color:#20160A;
    font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:18px;cursor:pointer;
  }
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  #status{font-size:14px;color:var(--go);text-align:center;margin-top:10px;min-height:18px;font-weight:600}
  .digits{font-size:13px;color:var(--muted);text-align:end;margin:-4px 0 10px}
  body[dir="rtl"]{font-family:'Heebo','Barlow Semi Condensed',sans-serif}
  @media (prefers-reduced-motion:reduce){.scan-line{animation:none;top:49%}}
</style>
</head>
<body>

  <div class="topbar">
    <h1 id="title">Scan<span class="cat" id="subtitle"></span></h1>
    <button class="close-btn" onclick="closeWindow()" aria-label="Close">&#10005;</button>
  </div>

  <div class="stage">
    <div id="reader"></div>
    <div class="cam-controls" id="camControls">
      <button type="button" class="cam-btn" id="torchBtn" onclick="toggleTorch()" title="Flash">&#128161;</button>
      <div class="zoom-group">
        <button type="button" class="cam-btn" onclick="adjustZoom(1)" title="Zoom in">+</button>
        <button type="button" class="cam-btn" onclick="adjustZoom(-1)" title="Zoom out">&minus;</button>
      </div>
    </div>
    <div class="scan-overlay">
      <div class="scan-frame"></div>
      <div class="scan-line"></div>
    </div>
  </div>

  <p id="live"></p>
  <p id="alertMsg"></p>
  <p id="hint">Line the barcode up inside the frame</p>

  <div class="manual">
    <label for="manualInput" id="manualLabel">Or type it in</label>
    <input type="text" id="manualInput" inputmode="numeric" autocomplete="off"
           onkeypress="if(event.key==='Enter') submitManual()">
    <div class="digits" id="digits">0 / 13</div>
    <button class="primary" id="useBtn" onclick="submitManual()">Use this number</button>
    <p id="status"></p>
  </div>

<script>
  /* ------------------------------------------------------------------
     Opened by the sorting web app with window.open, because Apps Script
     serves that app inside a cross-origin iframe whose Permissions-Policy
     withholds the camera. This page is top-level, so getUserMedia works.
     The value goes home through window.opener.postMessage.
     ------------------------------------------------------------------ */

  const params   = new URLSearchParams(window.location.search);
  const targetId = params.get('target') || 'barcode';
  const mode     = params.get('mode') === 'carton' ? 'carton' : 'item';
  const lang     = params.get('lang') === 'he' ? 'he' : 'en';

  const T = {
    en: {
      titleItem:'Scan item barcode', titleCarton:'Scan carton number',
      subItem:'13 digits', subCarton:'up to 12 digits',
      phItem:'13 digits', phCarton:'carton number',
      hint:'Line the barcode up inside the frame',
      manual:'Or type it in', use:'Use this number', sent:'Sent. Closing…',
      noDigits:'No digits in that code.',
      short:'Too short ({n}/{m}) — keep scanning.',
      longItem:'Too long ({n}/{m}) — not an item barcode.',
      longCarton:'Too long ({n} digits). A carton number is {m} at most — that looks like an item barcode.',
      noCam:'No camera on this device — type the number below.',
      denied:'Camera permission was refused. Allow it in the address bar and reload, or type the number below.',
      busy:'Another app is using the camera. Close it and reload, or type the number below.',
      failed:'The camera did not start. Type the number below.'
    },
    he: {
      titleItem:'סריקת ברקוד פריט', titleCarton:'סריקת מספר קרטון',
      subItem:'13 ספרות', subCarton:'עד 12 ספרות',
      phItem:'13 ספרות', phCarton:'מספר קרטון',
      hint:'יישר את הברקוד בתוך המסגרת',
      manual:'או הקלד ידנית', use:'השתמש במספר הזה', sent:'נשלח. סוגר…',
      noDigits:'אין ספרות בקוד הזה.',
      short:'קצר מדי ({n}/{m}) — המשך לסרוק.',
      longItem:'ארוך מדי ({n}/{m}) — זה לא ברקוד פריט.',
      longCarton:'ארוך מדי ({n} ספרות). מספר קרטון הוא עד {m} — זה נראה כמו ברקוד פריט.',
      noCam:'אין מצלמה במכשיר הזה — הקלד את המספר למטה.',
      denied:'הרשאת המצלמה נדחתה. אשר אותה בשורת הכתובת ורענן, או הקלד את המספר למטה.',
      busy:'אפליקציה אחרת משתמשת במצלמה. סגור אותה ורענן, או הקלד את המספר למטה.',
      failed:'המצלמה לא הופעלה. הקלד את המספר למטה.'
    }
  };

  const L = T[lang];
  function tr(key, p) {
    let s = L[key];
    if (p) Object.keys(p).forEach(function (k) { s = s.split('{' + k + '}').join(p[k]); });
    return s;
  }
  if (lang === 'he') { document.body.dir = 'rtl'; document.documentElement.lang = 'he'; }

  // Item barcodes are exactly 13 digits. Carton numbers are 1 to 12 digits.
  const LIMIT = mode === 'item' ? 13 : 12;
  const EXACT = mode === 'item';

  document.getElementById('title').firstChild.nodeValue = mode === 'item' ? L.titleItem : L.titleCarton;
  document.getElementById('subtitle').innerText        = mode === 'item' ? L.subItem   : L.subCarton;
  document.getElementById('manualInput').placeholder   = mode === 'item' ? L.phItem    : L.phCarton;
  document.getElementById('hint').innerText   = L.hint;
  document.getElementById('manualLabel').innerText = L.manual;
  document.getElementById('useBtn').innerText  = L.use;
  document.getElementById('manualInput').maxLength = LIMIT;
  document.getElementById('digits').innerText = '0 / ' + LIMIT;

  let closed = false;
  let scanner = null;

  /* ---------- sending the result home ---------- */
  function sendResult(value) {
    if (closed) return;
    closed = true;
    if (window.opener) {
      // '*' because the Apps Script sandbox origin is dynamic; the app checks
      // the source field and its own expected origin on arrival.
      window.opener.postMessage({ source: 'sorting-scanner', target: targetId, value: value }, '*');
    }
    document.getElementById('status').innerText = L.sent;
    teardown();
    setTimeout(function () { window.close(); }, 400);
  }

  function teardown() {
    if (scanner) { scanner.stop().then(function(){ scanner.clear(); }).catch(function(){}); }
  }

  function closeWindow() { closed = true; teardown(); window.close(); }

  /* ---------- validation ---------- */
  // A 13-digit EAN-13 and a 12-digit UPC-A are the same product code, the
  // EAN just carries a leading zero. Scanners disagree on which they report,
  // so pad a 12-digit read up to 13 rather than rejecting it as too short.
  function normalize(raw) {
    const d = String(raw || '').replace(/\D/g, '');
    if (mode === 'item' && /^\d{12}$/.test(d)) return '0' + d;
    return d;
  }

  function isValid(d) {
    return EXACT ? d.length === LIMIT : (d.length > 0 && d.length <= LIMIT);
  }

  function rejectText(d) {
    if (!d.length) return tr('noDigits');
    if (EXACT) {
      return d.length < LIMIT ? tr('short',    { n: d.length, m: LIMIT })
                              : tr('longItem', { n: d.length, m: LIMIT });
    }
    return tr('longCarton', { n: d.length, m: LIMIT });
  }

  /* ---------- beeps, built in WebAudio so nothing extra is hosted ---------- */
  function playTone(freq, dur, type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start(); osc.stop(ctx.currentTime + dur);
    } catch (e) { /* no audio — never block a scan over a sound */ }
  }
  function beepOk()   { playTone(1200, 0.15, 'sine'); }
  function beepFail() { playTone(220, 0.30, 'sawtooth'); }

  /* ---------- torch, zoom, autofocus ---------- */
  let torchOn = false, currentZoom = 1, zoomCaps = null;

  function setupCameraControls() {
    if (!scanner || typeof scanner.getRunningTrackCapabilities !== 'function') return;
    try {
      const caps = scanner.getRunningTrackCapabilities();
      document.getElementById('camControls').style.display = 'flex';
      document.getElementById('torchBtn').style.display = (caps && caps.torch) ? 'flex' : 'none';
      if (caps && caps.zoom) {
        zoomCaps = caps.zoom;
        currentZoom = (caps.zoom.min !== undefined) ? caps.zoom.min : 1;
      } else {
        document.querySelector('.zoom-group').style.display = 'none';
      }
      if (caps && caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
        scanner.applyVideoConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function(){});
      }
    } catch (e) { /* device reports no capabilities — controls stay hidden */ }
  }

  function toggleTorch() {
    if (!scanner) return;
    torchOn = !torchOn;
    scanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] })
      .then(function () { document.getElementById('torchBtn').classList.toggle('active', torchOn); })
      .catch(function () { torchOn = !torchOn; });
  }

  function adjustZoom(dir) {
    if (!scanner || !zoomCaps) return;
    const step = zoomCaps.step || 0.5;
    const min  = zoomCaps.min !== undefined ? zoomCaps.min : 1;
    const max  = zoomCaps.max !== undefined ? zoomCaps.max : 3;
    currentZoom = Math.max(min, Math.min(max, currentZoom + dir * step));
    scanner.applyVideoConstraints({ advanced: [{ zoom: currentZoom }] }).catch(function(){});
  }

  /* ---------- live decode ---------- */
  function onDecoded(text) {
    const live  = document.getElementById('live');
    const alrt  = document.getElementById('alertMsg');
    const d     = normalize(text);

    live.innerText = text;
    live.classList.toggle('invalid', !isValid(d));

    if (isValid(d)) {
      alrt.innerText = '';
      beepOk();
      sendResult(d);
    } else {
      alrt.innerText = rejectText(String(text).replace(/\D/g, ''));
      beepFail();
    }
  }

  function noCamera(msg) {
    document.querySelector('.stage').style.display = 'none';
    document.getElementById('hint').innerText = msg;
    document.getElementById('manualInput').focus();
  }

  function describe(e) {
    const s = String((e && e.name) || '') + String((e && e.message) || e);
    if (/NotFound|OverconstrainedError|device not found/i.test(s)) return L.noCam;
    if (/NotAllowed|Permission|denied/i.test(s))                  return L.denied;
    if (/NotReadable|TrackStart|Abort/i.test(s))                  return L.busy;
    return L.failed;
  }

  function start() {
    const formats = [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE
    ];
    try {
      scanner = new Html5Qrcode('reader', { formatsToSupport: formats, verbose: false });
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 260, height: 160 } },
        onDecoded,
        function () { /* per-frame miss — keep going */ }
      ).then(setupCameraControls)
       .catch(function (e) { noCamera(describe(e)); });
    } catch (e) {
      noCamera(describe(e));
    }
  }

  /* ---------- manual entry ---------- */
  const inp = document.getElementById('manualInput');
  inp.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, LIMIT);
    document.getElementById('digits').innerText = this.value.length + ' / ' + LIMIT;
    document.getElementById('alertMsg').innerText = '';
  });

  function submitManual() {
    const d = normalize(inp.value);
    if (!isValid(d)) { document.getElementById('alertMsg').innerText = rejectText(d); beepFail(); return; }
    beepOk();
    sendResult(d);
  }

  window.addEventListener('beforeunload', teardown);
  start();
</script>
</body>
</html>
